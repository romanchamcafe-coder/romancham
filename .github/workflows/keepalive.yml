name: Supabase keep-alive

# Pings the app's /api/keepalive endpoint on a schedule so the free-tier
# Supabase project registers database activity and never auto-pauses.
# (A paused project is what caused the intermittent "couldn't reach the
# server" on sign-in after a long idle period.)

on:
  schedule:
    # 06:00 UTC every 3rd day — comfortably inside Supabase's ~7-day idle window.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit keep-alive endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 30 \
              https://romancham-nine.vercel.app/api/keepalive || echo 000)
            echo "Attempt $i -> HTTP $code"; cat /tmp/out.txt; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "keep-alive failed after 3 attempts"; exit 1
